<!doctype html>
<!-- Generated by tools/build-apps-script.js from public/admin.html and admin.js. Edit those files and rebuild instead of editing this file. -->
<html lang="en">
<head>
<meta charset="utf-8">
<script>window.TT_CONFIG = __TT_CONFIG__;</script>
<script>
/* Tech Tank: Google Apps Script client bridge.
   Built into every Apps Script page (see build-apps-script.js) so the website code in public/ runs unchanged:
   - fetch('/api/...') goes to the server's api() function through google.script.run
   - EventSource('/api/stream') becomes a light polling loop that pauses while the tab is hidden
   - links to /, /login, /register, /portal and /admin open the matching web app page (target _top)
   - participant sessions are kept in this browser, because Apps Script pages cannot set cookies */
(() => {
  'use strict';
  const CFG = window.TT_CONFIG || {};
  const PAGES = { '/': 'home', '/index.html': 'home', '/login': 'login', '/register': 'register', '/account.html': 'login', '/portal': 'portal', '/portal.html': 'portal', '/admin': 'admin', '/admin.html': 'admin' };
  const TOKEN_KEY = 'tt-session';
  const MAX_UPLOAD = 20 * 1024 * 1024;

  /* ---------- storage that survives blocked or partitioned browser storage ---------- */
  const memory = {};
  const stores = () => { const out = []; try { out.push(window.localStorage); } catch {} try { out.push(window.sessionStorage); } catch {} return out.filter(Boolean); };
  const store = {
    get(key) { for (const s of stores()) { try { const v = s.getItem(key); if (v) return v; } catch {} } return memory[key] || ''; },
    set(key, value) { memory[key] = value; for (const s of stores()) { try { s.setItem(key, value); return; } catch {} } },
    remove(key) { delete memory[key]; for (const s of stores()) { try { s.removeItem(key); } catch {} } },
  };

  if (window.AbortSignal && !AbortSignal.timeout) {
    AbortSignal.timeout = (ms) => {
      const controller = new AbortController();
      setTimeout(() => controller.abort(new DOMException('The operation timed out.', 'TimeoutError')), ms);
      return controller.signal;
    };
  }

  /* ---------- page URLs ---------- */
  function pageUrl(page, hash) {
    const base = CFG.base || '';
    const sep = base.includes('?') ? '&' : '?';
    const url = page && page !== 'home' ? base + sep + 'page=' + encodeURIComponent(page) : base;
    return url + (hash ? (hash[0] === '#' ? hash : '#' + hash) : '');
  }
  function pathUrl(path) {
    let u;
    try { u = new URL(path, 'https://tech-tank.invalid'); } catch { return null; }
    const page = PAGES[u.pathname.replace(/\/+$/, '') || '/'];
    return page ? pageUrl(page, u.hash) : null;
  }
  function fixLink(a) {
    const raw = a.getAttribute('href');
    if (!raw || raw[0] !== '/' || raw[1] === '/') return;
    const url = pathUrl(raw);
    if (!url) return;
    a.setAttribute('href', url);
    const target = (a.getAttribute('target') || '').toLowerCase();
    // Pages run inside a frame: same-window links must replace the whole web app page.
    if (!target || target === '_self' || target === '_parent') a.setAttribute('target', '_top');
  }
  const fixAll = (node) => {
    if (node.matches && node.matches('a[href^="/"]')) fixLink(node);
    if (node.querySelectorAll) node.querySelectorAll('a[href^="/"]').forEach(fixLink);
  };
  new MutationObserver((records) => {
    for (const r of records) {
      if (r.type === 'attributes') { if (r.target.tagName === 'A') fixLink(r.target); }
      else r.addedNodes.forEach((n) => { if (n.nodeType === 1) fixAll(n); });
    }
  }).observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['href'] });
  document.addEventListener('DOMContentLoaded', () => fixAll(document));
  document.addEventListener('click', (e) => { const a = e.target.closest && e.target.closest('a[href^="/"]'); if (a) fixLink(a); }, true);

  /* ---------- server calls ---------- */
  function serverCall(req) {
    return new Promise((resolve, reject) => {
      const run = window.google && google.script && google.script.run;
      if (!run) { reject(new Error('Open this page from its Google Apps Script web app link.')); return; }
      run.withSuccessHandler(resolve)
        .withFailureHandler((err) => reject(err instanceof Error ? err : new Error(String((err && err.message) || err || 'Request failed'))))
        .api(req);
    });
  }
  const abortReason = (signal) => (signal.reason && signal.reason.name ? signal.reason : new DOMException('The operation was aborted.', 'AbortError'));
  function withSignal(promise, signal) {
    if (!signal) return promise;
    if (signal.aborted) return Promise.reject(abortReason(signal));
    return new Promise((resolve, reject) => {
      const onAbort = () => reject(abortReason(signal));
      signal.addEventListener('abort', onAbort, { once: true });
      promise.then((v) => { signal.removeEventListener('abort', onAbort); resolve(v); }, (e) => { signal.removeEventListener('abort', onAbort); reject(e); });
    });
  }
  function toResponse(out) {
    const status = out && out.status >= 200 && out.status <= 599 ? out.status : 500;
    if (out && out.base64 != null) {
      const bin = atob(out.base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const type = out.contentType || 'application/octet-stream';
      return new Response(new Blob([bytes], { type }), { status, headers: { 'Content-Type': type } });
    }
    return new Response(out && out.json != null ? out.json : JSON.stringify({ error: 'Could not complete the request. Please try again.' }), { status, headers: { 'Content-Type': 'application/json; charset=utf-8' } });
  }
  const json = (status, body) => toResponse({ status, json: JSON.stringify(body) });

  // Latest public content. The live poll keeps it current, so periodic page refreshes need no extra request.
  let publicCache = CFG.boot ? { content: CFG.boot, at: Date.now() } : null;
  const PUBLIC_FRESH_MS = Math.max(15000, (CFG.pollMs || 5000) * 4);

  async function apiFetch(url, init) {
    const method = String(init.method || 'GET').toUpperCase();
    const headers = new Headers(init.headers || {});
    const path = url.pathname;
    const passcode = headers.get('x-admin-passcode') || '';
    const token = store.get(TOKEN_KEY);
    if (!token && method === 'GET' && (path === '/api/account' || path === '/api/portal')) return json(401, { error: 'Please sign in' });
    if (method === 'GET' && path === '/api/content' && !passcode && publicCache && Date.now() - publicCache.at < PUBLIC_FRESH_MS) {
      return json(200, publicCache.content);
    }
    let body = init.body == null ? '' : init.body;
    if (typeof body !== 'string') body = await new Response(body).text();
    const out = await serverCall({ method, path, query: Object.fromEntries(url.searchParams), body, passcode, token });
    if (out && out.token) { store.set(TOKEN_KEY, out.token); delete out.token; }
    if (path === '/api/account/logout' && out && out.status < 300) store.remove(TOKEN_KEY);
    if (token && out && out.status === 401 && (path === '/api/account' || path === '/api/portal')) store.remove(TOKEN_KEY);
    if (method === 'GET' && path === '/api/content' && !passcode && out && out.status === 200) {
      try { publicCache = { content: JSON.parse(out.json), at: Date.now() }; } catch {}
    }
    return toResponse(out);
  }

  const nativeFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = function (input, init) {
    init = init || {};
    let url = null;
    try { url = new URL(typeof input === 'string' || input instanceof URL ? String(input) : input.url, location.href); } catch {}
    if (!url || url.origin !== location.origin || !url.pathname.startsWith('/api/')) {
      return nativeFetch ? nativeFetch(input, init) : Promise.reject(new TypeError('Network requests are not available'));
    }
    return withSignal(apiFetch(url, init), init.signal);
  };

  /* ---------- live updates: polling in place of server-sent events ---------- */
  const streams = new Set();
  const pollDelay = () => Math.round((CFG.pollMs || 5000) * (0.85 + Math.random() * 0.3));
  class PollingEventSource {
    constructor(url) {
      this.url = String(url); this.readyState = 0; this.withCredentials = false;
      this.onopen = null; this.onmessage = null; this.onerror = null;
      this.listeners = {}; this.version = CFG.version || ''; this.failures = 0; this.busy = false; this.closed = false; this.timer = 0;
      streams.add(this);
      this.schedule(this.version ? pollDelay() : 0);
    }
    addEventListener(type, fn) { (this.listeners[type] = this.listeners[type] || []).push(fn); }
    removeEventListener(type, fn) { this.listeners[type] = (this.listeners[type] || []).filter((f) => f !== fn); }
    close() { this.closed = true; this.readyState = 2; clearTimeout(this.timer); streams.delete(this); }
    emit(type, data) {
      const event = { type, data, lastEventId: '', target: this };
      const handlers = (this.listeners[type] || []).slice();
      if (typeof this['on' + type] === 'function') handlers.push(this['on' + type]);
      handlers.forEach((fn) => { try { fn.call(this, event); } catch (err) { setTimeout(() => { throw err; }); } });
    }
    schedule(ms) { clearTimeout(this.timer); if (!this.closed) this.timer = setTimeout(() => this.poll(), ms); }
    wake() { if (!this.closed && !this.busy) this.schedule(0); }
    async poll() {
      if (this.closed || this.busy) return;
      if (document.hidden) return; // resumes when the tab is visible again
      this.busy = true;
      try {
        const out = await serverCall({ method: 'GET', path: '/api/stream', query: { since: this.version } });
        if (!out || out.status !== 200) throw new Error('Update check failed');
        const data = JSON.parse(out.json);
        if (this.readyState !== 1) { this.readyState = 1; this.emit('open'); }
        if (data.content) publicCache = { content: data.content, at: Date.now() };
        else if (publicCache) publicCache.at = Date.now();
        if (data.version && data.version !== this.version) {
          this.version = data.version;
          if (data.content) this.emit('content', JSON.stringify(data.content));
        }
        this.failures = 0;
      } catch {
        this.failures++;
        this.readyState = 0;
        this.emit('error');
      } finally {
        this.busy = false;
        this.schedule(this.failures ? Math.min(60000, (CFG.pollMs || 5000) * 2 ** this.failures) : pollDelay());
      }
    }
  }
  const NativeEventSource = window.EventSource;
  window.EventSource = function EventSource(url, options) {
    let u = null;
    try { u = new URL(url, location.href); } catch {}
    if (u && u.origin === location.origin && u.pathname === '/api/stream') return new PollingEventSource(url);
    if (!NativeEventSource) throw new TypeError('EventSource is not supported');
    return new NativeEventSource(url, options);
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) streams.forEach((s) => s.wake()); });
  addEventListener('online', () => streams.forEach((s) => s.wake()));

  /* ---------- Control Room uploads (replaces XMLHttpRequest for /api/upload) ---------- */
  class UploadRequest {
    constructor() { this.upload = {}; this.status = 0; this.responseText = ''; this.headers = {}; this.onload = null; this.onerror = null; }
    open(method, url) { this.method = String(method).toUpperCase(); this.url = new URL(url, location.href); }
    setRequestHeader(key, value) { this.headers[String(key).toLowerCase()] = String(value); }
    finish(status, body) { this.status = status; this.responseText = typeof body === 'string' ? body : JSON.stringify(body); if (this.onload) this.onload(); }
    send(file) {
      if (!file || typeof file.size !== 'number') { this.finish(400, { error: 'Choose a file to upload' }); return; }
      if (file.size > MAX_UPLOAD) { this.finish(413, { error: 'Files up to 20 MB can be uploaded here. Add larger videos by YouTube or Google Drive link.' }); return; }
      const progress = (fraction) => { if (this.upload.onprogress) this.upload.onprogress({ loaded: fraction * file.size, total: file.size || 1, lengthComputable: true }); };
      const reader = new FileReader();
      reader.onprogress = (e) => { if (e.lengthComputable) progress(e.loaded / e.total * 0.4); };
      reader.onerror = () => { if (this.onerror) this.onerror(); };
      reader.onload = () => {
        let fraction = 0.45;
        progress(fraction);
        const creep = setInterval(() => { fraction = Math.min(0.95, fraction + 0.03); progress(fraction); }, 500);
        serverCall({
          method: this.method || 'POST', path: this.url.pathname, query: Object.fromEntries(this.url.searchParams),
          body: JSON.stringify({ data: String(reader.result).replace(/^data:[^,]*,/, ''), type: file.type }),
          passcode: this.headers['x-admin-passcode'] || '',
        }).then((out) => { clearInterval(creep); progress(1); this.finish(out.status, out.json); },
          () => { clearInterval(creep); if (this.onerror) this.onerror(); });
      };
      reader.readAsDataURL(file);
    }
  }

  /* ---------- page-to-page navigation ---------- */
  const NAV_TEXT = {
    '/login': ['Sign in to continue', 'Sign in to open your participant portal.', 'Sign in'],
    '/portal': ['You’re signed in', 'Your participant portal is ready.', 'Open my portal ↗'],
  };
  function showContinue(url, path, opts) {
    if (!document.body) { document.addEventListener('DOMContentLoaded', () => showContinue(url, path, opts), { once: true }); return; }
    const defaults = NAV_TEXT[(path || '').split('#')[0]] || ['Continue', 'Open the next page to continue.', 'Continue ↗'];
    const [title, text, label] = [opts.title || defaults[0], opts.text || defaults[1], opts.label || defaults[2]];
    let box = document.getElementById('tt-continue');
    if (!box) {
      box = document.createElement('div');
      box.id = 'tt-continue';
      box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-labelledby', 'tt-continue-title');
      box.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:16px;background:rgba(3,6,12,.82);backdrop-filter:blur(6px);font-family:Manrope,system-ui,sans-serif';
      document.body.appendChild(box);
    }
    const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const extra = path === '/login'
      ? `<a href="${esc(pageUrl('register'))}" target="_top" style="color:#9fe8ff">Create an account</a>`
      : opts.signOut ? '<button type="button" id="tt-continue-signout" style="background:none;border:0;color:#9fe8ff;font:inherit;cursor:pointer;text-decoration:underline">Not you? Sign out</button>' : '';
    box.innerHTML = `<div style="width:min(420px,100%);padding:28px;border-radius:16px;background:#0d1622;border:1px solid rgba(255,255,255,.12);color:#e9eef9;box-shadow:0 30px 80px -20px #000;text-align:center">
      <h2 id="tt-continue-title" style="margin:0 0 8px;font-size:1.4rem">${esc(title)}</h2>
      <p style="margin:0 0 20px;color:#a9b4c9;line-height:1.5">${esc(text)}</p>
      <a id="tt-continue-go" href="${esc(url)}" target="_top" style="display:inline-block;padding:13px 24px;border-radius:10px;background:#40d6ff;color:#001018;font-weight:700;text-decoration:none">${esc(label)}</a>
      <p style="margin:16px 0 0;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:.9rem">${extra}<a href="${esc(pageUrl('home'))}" target="_top" style="color:#9fe8ff">Main website</a></p></div>`;
    const signOut = document.getElementById('tt-continue-signout');
    if (signOut) signOut.addEventListener('click', async () => {
      signOut.disabled = true;
      try { await fetch('/api/account/logout', { method: 'POST' }); } catch {}
      store.remove(TOKEN_KEY);
      box.remove();
    });
    document.getElementById('tt-continue-go').focus({ preventScroll: true });
  }
  function navigate(path, opts) {
    opts = opts || {};
    const url = pathUrl(path) || pageUrl('home');
    // Browsers let a framed page open another top-level page only shortly after a click or key press.
    const allowed = !navigator.userActivation || navigator.userActivation.isActive;
    if (allowed) { try { window.top.location.href = url; } catch {} }
    setTimeout(() => showContinue(url, path, opts), allowed ? 1200 : 0);
  }

  /* ---------- page specific ---------- */
  if ((CFG.page === 'login' || CFG.page === 'register') && store.get(TOKEN_KEY)) {
    // Signed-in participants go straight to their portal, as on the Node server.
    window.fetch('/api/account').then((r) => (r.ok ? r.json() : null)).then((data) => {
      if (data && data.user) navigate('/portal', { title: 'You’re signed in', text: `Signed in as ${data.user.name}. Your participant portal is ready.`, signOut: true });
    }).catch(() => {});
  }
  if (CFG.page === 'portal') {
    // Keep portal sections (#question, #rules, ...) in the address bar so they can be bookmarked and shared.
    const follow = (loc) => { if (loc && loc.hash && location.hash.slice(1) !== loc.hash) location.hash = loc.hash; };
    document.addEventListener('DOMContentLoaded', () => {
      try { google.script.url.getLocation(follow); } catch {}
      // Address bar edits and back/forward in the browser switch sections too.
      try { google.script.history.setChangeHandler((e) => follow(e && e.location)); } catch {}
    });
    addEventListener('hashchange', () => { try { google.script.history.replace(null, { page: 'portal' }, location.hash.slice(1)); } catch {} });
  }

  window.TT = { page: CFG.page || 'home', base: CFG.base || '', url: pageUrl, pathUrl, navigate, UploadRequest };
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Tank Control Room</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#06070c; --panel:#0d0f18; --panel2:#131624; --line:rgba(255,255,255,.09); --text:#eef1f8; --dim:#8a90a6;
  --cyan:#2ec5ff; --violet:#7c5cff; --red:#ff3b5c; --amber:#ffb020; --green:#18e0a0;
  --display:'Space Grotesk',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font:15px/1.5 var(--display); min-height:100vh; }
[hidden] { display:none !important; }
button, input, select, textarea { font:inherit; color:inherit; }
.mono { font-family:var(--mono); }
.dim { color:var(--dim); }

/* login */
.login { min-height:100vh; display:grid; place-items:center; padding:16px;
  background:radial-gradient(ellipse at 30% 20%, rgba(124,92,255,.18), transparent 50%), radial-gradient(ellipse at 80% 90%, rgba(46,197,255,.12), transparent 50%); }
.login form { width:min(400px,100%); padding:36px; border-radius:22px; background:var(--panel); border:1px solid var(--line); box-shadow:0 30px 80px -30px #000; }
.login h1 { font-size:1.7rem; letter-spacing:-.02em; margin:14px 0 4px; }
.login p { color:var(--dim); margin-bottom:22px; }
.logo-mark { display:inline-grid; place-items:center; width:42px; height:42px; border-radius:12px; font:700 .95rem var(--mono); background:linear-gradient(135deg,var(--cyan),var(--violet)); color:#000; }
.err { color:var(--red); font-size:.9rem; margin-top:10px; min-height:1.2em; }

/* shell */
.shell { display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
.side { position:sticky; top:0; height:100vh; overflow:auto; padding:20px 14px; border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; gap:4px; }
.side .brand { display:flex; align-items:center; gap:10px; padding:4px 8px 18px; font-weight:700; }
.side .brand .logo-mark { width:34px; height:34px; font-size:.8rem; }
.tab { display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 12px; border-radius:10px; border:0; background:transparent; color:var(--dim); cursor:pointer; font-weight:500; }
.tab:hover { background:var(--panel2); color:var(--text); }
.tab.on { background:linear-gradient(90deg, rgba(46,197,255,.14), transparent); color:var(--text); box-shadow:inset 2px 0 var(--cyan); }
.svg-icon { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; flex:none; vertical-align:middle; }
.svg-icon svg { display:block; }
.side .foot { margin-top:auto; padding:12px 8px 0; display:grid; gap:8px; }
.side .foot a { color:var(--cyan); text-decoration:none; font-size:.9rem; }

main { min-width:0; }
.topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 28px; border-bottom:1px solid var(--line); background:rgba(6,7,12,.85); backdrop-filter:blur(12px); flex-wrap:wrap; }
.topbar h2 { font-size:1.25rem; letter-spacing:-.01em; margin-right:auto; }
.state { font:600 .75rem var(--mono); padding:6px 10px; border-radius:99px; border:1px solid var(--line); color:var(--green); }
.state.dirty { color:var(--amber); border-color:rgba(255,176,32,.4); }
.state.err { color:var(--red); }
.auto { display:flex; gap:6px; align-items:center; font-size:.85rem; color:var(--dim); cursor:pointer; }
.menu { display:none; }
.content { padding:28px; max-width:1100px; }

/* controls */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 18px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-weight:600; white-space:nowrap; transition:border-color .15s, transform .1s; }
.btn:hover { border-color:var(--cyan); }
.btn:active { transform:scale(.97); }
.btn.primary { background:linear-gradient(135deg,var(--cyan),var(--violet)); color:#000; border:0; }
.btn.danger { background:var(--red); color:#fff; border:0; }
.btn.ghost { background:transparent; }
.btn.sm { padding:6px 10px; font-size:.82rem; border-radius:8px; }
.btn.icon { width:32px; height:32px; padding:0; border-radius:8px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:18px; }
.card h3 { font-size:1.05rem; margin-bottom:4px; }
.card > .hint { color:var(--dim); font-size:.88rem; margin-bottom:16px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
label.f { display:grid; gap:6px; font-size:.82rem; color:var(--dim); margin-bottom:12px; }
label.f.inline { display:flex; align-items:center; gap:10px; color:var(--text); font-size:.95rem; }
input[type=text], input[type=number], input[type=url], input[type=email], input[type=password], input[type=datetime-local], select, textarea {
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:.95rem; outline:none; transition:border-color .15s; }
input:focus, select:focus, textarea:focus { border-color:var(--cyan); }
textarea { resize:vertical; min-height:80px; line-height:1.5; }
input[type=color] { width:44px; height:40px; border:1px solid var(--line); border-radius:10px; background:var(--bg); padding:3px; cursor:pointer; }
input[type=checkbox] { width:18px; height:18px; accent-color:var(--cyan); }

.list { display:grid; gap:10px; }
.item { display:grid; grid-template-columns:1fr auto; gap:12px; padding:14px; border-radius:12px; background:var(--panel2); border:1px solid var(--line); }
.item.compact { padding:8px 8px 8px 12px; align-items:center; }
.item .ctrl { display:flex; flex-direction:column; gap:4px; }
.item.compact .ctrl { flex-direction:row; }
.item .body label.f:last-child { margin-bottom:0; }

.phases { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
.phase { padding:16px 10px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; text-align:center; font-weight:600; transition:all .15s; }
.phase small { display:block; color:var(--dim); font-weight:400; font-size:.75rem; margin-top:2px; }
.phase.on { border-color:var(--c); background:color-mix(in srgb, var(--c) 16%, transparent); box-shadow:0 0 0 1px var(--c) inset; }
.alert-live { display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:12px; background:rgba(255,59,92,.12); border:1px solid rgba(255,59,92,.4); color:#ffc9d2; margin-bottom:14px; }
.pulse { width:10px; height:10px; border-radius:50%; background:var(--red); animation:p 1s infinite; flex:none; }
@keyframes p { 50% { opacity:.3; } }
.presets { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }

/* score grid */
.scores { width:100%; border-collapse:separate; border-spacing:0; overflow:auto; display:block; }
.scores table { border-collapse:collapse; width:100%; min-width:640px; }
.scores th, .scores td { padding:8px; border-bottom:1px solid var(--line); text-align:center; }
.scores th { font:600 .72rem var(--mono); color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
.scores td:first-child, .scores th:first-child { text-align:left; }
.scores input { width:70px; text-align:center; padding:8px 4px; font-family:var(--mono); }
.scores .tot { font:700 1.05rem var(--mono); color:var(--cyan); }
.scores .rank { font:600 .8rem var(--mono); color:var(--dim); }
.stepper { display:inline-flex; align-items:center; gap:2px; }
.stepper button { width:24px; height:34px; border:1px solid var(--line); background:var(--panel2); border-radius:6px; cursor:pointer; color:var(--dim); }
.stepper button:hover { color:var(--text); border-color:var(--cyan); }

/* media */
.drop { display:grid; place-items:center; gap:6px; padding:34px; border:2px dashed var(--line); border-radius:16px; text-align:center; color:var(--dim); cursor:pointer; transition:all .15s; }
.drop.over, .drop:hover { border-color:var(--cyan); color:var(--text); background:rgba(46,197,255,.05); }
.drop b { color:var(--text); font-size:1.05rem; }
.media-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.mcard { border-radius:12px; overflow:hidden; background:var(--panel2); border:1px solid var(--line); display:flex; flex-direction:column; }
.mcard .thumb { aspect-ratio:16/10; background:#000 center/cover no-repeat; display:grid; place-items:center; color:var(--dim); font:600 .75rem var(--mono); }
.mcard .thumb video { width:100%; height:100%; object-fit:cover; }
.mcard .mb { padding:10px; display:grid; gap:8px; }
.mcard .row { display:flex; gap:6px; }
.progress { height:4px; border-radius:99px; background:var(--panel2); overflow:hidden; margin-top:10px; }
.progress i { display:block; height:100%; width:0; background:var(--cyan); transition:width .2s; }

.toast { position:fixed; right:20px; bottom:20px; z-index:100; padding:12px 18px; border-radius:12px; background:var(--panel2); border:1px solid var(--line); box-shadow:0 20px 50px -10px #000; transform:translateY(20px); opacity:0; transition:all .25s; pointer-events:none; }
.toast.show { transform:none; opacity:1; }
.toast.ok { border-color:rgba(24,224,160,.5); }
.toast.bad { border-color:rgba(255,59,92,.6); }
.sum { font:600 .85rem var(--mono); }
.sum.bad { color:var(--amber); }
kbd { font:600 .72rem var(--mono); padding:2px 6px; border:1px solid var(--line); border-radius:5px; color:var(--dim); }

@media (max-width: 860px) {
  .shell { grid-template-columns:1fr; }
  .side { position:fixed; z-index:50; left:0; top:0; width:260px; transform:translateX(-100%); transition:transform .25s; box-shadow:20px 0 60px #000; }
  .side.open { transform:none; }
  .menu { display:inline-flex; }
  .content { padding:16px; }
  .topbar { padding:12px 16px; }
  .topbar kbd { display:none; }
  .grid2, .grid3 { grid-template-columns:1fr; }
  .phases { grid-template-columns:repeat(2,1fr); }
}

<body>

    <label class="f inline"><input type="checkbox" id="remember"> Keep me signed in on this device</label>

</section>

<div class="shell" id="app" hidden>

    </div>

  <main>
    <div class="topbar">
      <button class="btn icon menu" id="menu" aria-label="Menu"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h2 id="tabTitle"></h2>
      <label class="auto" title="Publish every change automatically, a second after you stop typing"><input type="checkbox" id="autopub"> Auto-publish</label>
      <span class="state" id="state">Saved</span>
      <button class="btn ghost sm" id="revert" title="Throw away unpublished changes">Discard</button>
      <button class="btn primary" id="publish">Publish <kbd style="color:#000;border-color:rgba(0,0,0,.3)">Ctrl S</kbd></button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
/* Tech Tank Control Room — edits data/content.json through the API. No code edits needed to run the event. */
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
let PASS = '';
let D = null;          // draft content
let savedStr = '';     // last published JSON
let tab = 'live';

/* ---------- tiny DOM helper ---------- */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k in el && k !== 'list') el[k] = v;

  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}
const uid = (p) => p + Math.random().toString(36).slice(2, 8);
const pad = (n) => String(n).padStart(2, '0');
const ICONS = {
  bolt: '<path d="m13 2-9 12h7l-1 8 10-12h-7z"/>',
  portal: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18m4-12 3 3-3 3"/>',
  person: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',
  trophy: '<path d="M8 3h8v5a4 4 0 0 1-8 0V3Zm0 2H4v2a4 4 0 0 0 4 4m8-6h4v2a4 4 0 0 1-4 4m-4 1v6m-4 3h8m-6-3h4v3h-4z"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m21 15-5-5L5 21"/>',
  question: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4m0 4h.01"/>',
  check: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m7 12 3 3 7-7"/>',
  people: '<circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2m1-16a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 4v2"/>',
  rules: '<path d="M6 3h12a2 2 0 0 1 2 2v16H8a4 4 0 0 1-4-4V5a2 2 0 0 1 2-2Zm2 0v18m4-13h4m-4 4h4m-4 4h4"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18m-13 4h2m4 0h2"/>',
  settings: '<path d="m9 3-.5 3-2 1L4 6l-2 4 2.5 2v2L2 16l2 4 2.5-1 2 1L9 23h6l.5-3 2-1 2.5 1 2-4-2.5-2v-2L22 10l-2-4-2.5 1-2-1L15 3z" transform="translate(1 0) scale(.92)"/><circle cx="12" cy="12" r="3"/>',
  compass: '<circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5z"/>',
  shuffle: '<path d="M3 7h3c4 0 8 10 12 10h3m-4-4 4 4-4 4M3 17h3c1 0 2-1 3-2m6-6 3-2h3m-4-4 4 4-4 4"/>',
  chat: '<path d="M21 11a8 8 0 0 1-8 8H7l-5 3 2-6a8 8 0 0 1-1-5 9 9 0 0 1 18 0Z"/><path d="M8 10h8m-8 4h5"/>',
  code: '<path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-14-2 16"/>',
  up: '<path d="m6 12 6-6 6 6m-6-6v15"/>',
  down: '<path d="m6 12 6 6 6-6m-6 6V3"/>',
  left: '<path d="m12 6-6 6 6 6m-6-6h15"/>',
  right: '<path d="m12 6 6 6-6 6m6-6H3"/>',
  close: '<path d="m6 6 12 12M6 18 18 6"/>',
};
const icon = (name) => h('span', { class: 'svg-icon', 'aria-hidden': 'true', html: `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false">${ICONS[name]}</svg>` });

function toast(msg, kind = 'ok') {
  const t = $('#toast'); t.textContent = msg; t.className = `toast show ${kind}`;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'toast', 2600);
}

/* ---------- dirty state + publishing ---------- */
const isDirty = () => JSON.stringify(D) !== savedStr;
let autoTimer;
function changed() {
  const st = $('#state'); const d = isDirty();
  st.textContent = d ? 'Unpublished changes' : 'All changes live'; st.className = 'state' + (d ? ' dirty' : '');
  if (d && $('#autopub').checked) { clearTimeout(autoTimer); autoTimer = setTimeout(publish, 1000); }
}
async function api(method, url, body, raw) {
  const res = await fetch(url, { method, headers: { 'x-admin-passcode': PASS, ...(raw ? {} : { 'Content-Type': 'application/json' }) }, body: raw ? body : body && JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error('Session expired, sign in again'); }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
let pendingPublish = null;
function publish(msg) {
  // Serialize saves so a slower, older request cannot overwrite a newer one.
  if (pendingPublish) return pendingPublish.then((ok) => ok && isDirty() ? publish(msg) : ok);
  pendingPublish = saveDraft(msg).finally(() => { pendingPublish = null; });
  return pendingPublish;
}
async function saveDraft(msg) {
  clearTimeout(autoTimer);
  const st = $('#state'); st.textContent = 'Publishing...';
  try {
    const out = await api('PUT', '/api/content', D);
    savedStr = JSON.stringify(out);
    // Keep the draft and field bindings intact, including edits typed during the save.
    D.updatedAt = out.updatedAt;
    changed(); toast(isDirty() ? 'Published. Newer edits still need publishing.' : typeof msg === 'string' ? msg : 'Published. The live site is updated.');
    return true;
  } catch (e) { st.textContent = 'Publish failed'; st.className = 'state err'; toast(e.message, 'bad'); return false; }
}

/* ---------- field builders (bind straight into the draft) ---------- */
function text(obj, key, label, o = {}) {
  const input = o.multiline ? h('textarea', { rows: o.rows || 3 }) : h('input', { type: o.type || 'text' });
  input.value = obj[key] ?? ''; if (o.placeholder) input.placeholder = o.placeholder;
  input.addEventListener('input', () => { obj[key] = o.type === 'number' ? (input.value === '' ? '' : Number(input.value)) : input.value; changed(); o.onchange && o.onchange(); });
  return label ? h('label', { class: 'f' }, label, input) : input;
}
const num = (obj, key, label, o = {}) => text(obj, key, label, { ...o, type: 'number' });
function check(obj, key, label, onchange) {
  const c = h('input', { type: 'checkbox', checked: !!obj[key] });
  c.addEventListener('change', () => { obj[key] = c.checked; changed(); onchange && onchange(); });
  return h('label', { class: 'f inline' }, c, label);
}
function select(obj, key, label, options, onchange) {
  const s = h('select', {}, options.map(([v, l]) => h('option', { value: v }, l)));
  s.value = obj[key] ?? ''; s.addEventListener('change', () => { obj[key] = s.value; changed(); onchange && onchange(); });
  return label ? h('label', { class: 'f' }, label, s) : s;
}
function color(obj, key, label) {
  const c = h('input', { type: 'color', value: obj[key] || '#2ec5ff' });
  c.addEventListener('input', () => { obj[key] = c.value; changed(); });
  return h('label', { class: 'f' }, label, c);
}
function lines(obj, key, label, hint = 'One per line') {
  const t = h('textarea', { rows: Math.max(3, (obj[key] || []).length + 1), placeholder: hint });
  t.value = (obj[key] || []).join('\n');
  t.addEventListener('input', () => { obj[key] = t.value.split('\n').map((s) => s.trim()).filter(Boolean); changed(); });
  return h('label', { class: 'f' }, h('span', {}, label, h('span', { class: 'dim' }, `  (${hint.toLowerCase()})`)), t);
}
function dt(obj, key, label) {
  const i = h('input', { type: 'datetime-local' });
  const d = new Date(obj[key]);
  if (!isNaN(d)) i.value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  i.addEventListener('change', () => {
    if (!i.value) { obj[key] = ''; changed(); return; }
    const off = -new Date(i.value).getTimezoneOffset();
    obj[key] = `${i.value}:00${off >= 0 ? '+' : '-'}${pad(Math.floor(Math.abs(off) / 60))}:${pad(Math.abs(off) % 60)}`; changed();
  });
  return h('label', { class: 'f' }, label, i);
}
/* reorderable list of anything */
function list(arr, renderItem, makeNew, o = {}) {
  const wrap = h('div', { class: 'list' });
  arr.forEach((item, i) => {
    const ctrl = h('div', { class: 'ctrl' },
      h('button', { class: 'btn icon sm', title: 'Move up', disabled: i === 0, onclick: () => { arr.splice(i - 1, 0, arr.splice(i, 1)[0]); changed(); render(); } }, icon('up')),
      h('button', { class: 'btn icon sm', title: 'Move down', disabled: i === arr.length - 1, onclick: () => { arr.splice(i + 1, 0, arr.splice(i, 1)[0]); changed(); render(); } }, icon('down')),
      h('button', { class: 'btn icon sm', title: 'Delete', style: 'color:var(--red)', onclick: () => { if (o.confirm === false || confirm('Delete this item?')) { arr.splice(i, 1); changed(); render(); } } }, icon('close')));
    wrap.append(h('div', { class: 'item' + (o.compact ? ' compact' : '') }, h('div', { class: 'body' }, renderItem(item, i)), ctrl));
  });
  const add = h('button', { class: 'btn', onclick: () => { o.top ? arr.unshift(makeNew()) : arr.push(makeNew()); changed(); render(); } }, '+ ' + (o.addLabel || 'Add'));
  return h('div', {}, wrap, h('div', { style: 'margin-top:12px' }, add));
}
const strList = (arr, add, ph) => list(arr, (_, i) => { const inp = h('input', { type: 'text', value: arr[i], placeholder: ph || '' }); inp.addEventListener('input', () => { arr[i] = inp.value; changed(); }); return inp; }, () => '', { compact: true, addLabel: add, confirm: false });
const card = (title, hint, ...kids) => h('div', { class: 'card' }, h('h3', {}, title), hint ? h('p', { class: 'hint' }, hint) : null, ...kids);

/* ---------- tabs ---------- */
const TABS = [
  ['live', 'bolt', 'Live control'],
  ['portal', 'portal', 'Participant portal'],
  ['participants', 'person', 'Participant accounts'],
  ['results', 'trophy', 'Results'],
  ['media', 'image', 'Media'],
  ['question', 'question', 'Question card'],
  ['qualifiers', 'check', 'Qualifiers'],
  ['teams', 'people', 'Teams'],
  ['rules', 'rules', 'Rules & judging'],
  ['schedule', 'calendar', 'Schedule'],
  ['event', 'settings', 'Event details'],
  ['tracks', 'compass', 'Tracks'],
  ['crisis', 'shuffle', 'The twist'],
  ['faq', 'chat', 'FAQ & organisers'],
  ['raw', 'code', 'Raw data'],
];

const V = {};

V.live = () => {
  const phases = [['upcoming', 'Upcoming', 'before start', '#8a90a6'], ['live', 'Hacking', 'build phase', '#18e0a0'], ['crisis', 'Twist', 'reality check', '#ff3b5c'], ['judging', 'Judging', 'demos', '#ffb020'], ['ended', 'Ended', 'results out', '#7c5cff']];
  const ph = h('div', { class: 'phases' }, phases.map(([v, l, s, c]) => h('button', { class: 'phase' + (D.event.phase === v ? ' on' : ''), style: `--c:${c}`, onclick: async () => { D.event.phase = v; render(); await publish(`Phase set to ${l}`); } }, l, h('small', {}, s))));

  const a = D.alert = D.alert || {};
  const presets = h('div', { class: 'presets' },
    h('button', { class: 'btn sm', onclick: () => { Object.assign(a, { level: 'RED', title: 'Reality check', message: 'The twist is live. Check your table for your scenario. The adaptation window starts now.' }); render(); } }, 'Twist is live'),
    h('button', { class: 'btn sm', onclick: () => { Object.assign(a, { level: 'AMBER', title: '15 minutes left', message: 'The adaptation window closes in 15 minutes. Lock in your crisis response.' }); render(); } }, '15 min warning'),
    h('button', { class: 'btn sm', onclick: () => { Object.assign(a, { level: 'AMBER', title: 'Code freeze', message: 'Stop coding. Push your final commit and submit your README now.' }); render(); } }, 'Code freeze'),
    h('button', { class: 'btn sm', onclick: () => { Object.assign(a, { level: 'INFO', title: 'Registrations close soon', message: 'Last call. Register your team before the deadline.' }); render(); } }, 'Last call to register'),
    h('button', { class: 'btn sm', onclick: () => { Object.assign(a, { level: 'INFO', title: 'Qualifiers announced', message: 'The qualified teams list is live. Scroll to the end to find your team.' }); render(); } }, 'Qualifiers out'),
    h('button', { class: 'btn sm', onclick: () => { Object.assign(a, { level: 'INFO', title: 'Results are live', message: 'The winners have been announced. Scroll to Live Results.' }); render(); } }, 'Results live'));

  const ann = D.announcements = D.announcements || [];
  const quick = h('input', { type: 'text', placeholder: 'Type an announcement and press Enter to post it live' });
  const post = async () => {
    if (!quick.value.trim()) return;
    const n = new Date(); ann.unshift({ id: uid('a'), time: `${pad(n.getHours())}:${pad(n.getMinutes())}`, text: quick.value.trim() });
    quick.value = ''; render(); await publish('Announcement posted');
  };
  quick.addEventListener('keydown', (e) => { if (e.key === 'Enter') post(); });

  return [
    card('Event phase', 'Shown as a badge on the site. Click to switch, it goes live immediately.', ph),
    card('Broadcast alert', 'Flashes a full-screen alert with a sound on every open screen, then stays as a banner until you clear it.',
      a.active ? h('div', { class: 'alert-live' }, h('span', { class: 'pulse' }), h('div', { style: 'flex:1' }, h('b', {}, 'LIVE NOW: '), a.title), h('button', { class: 'btn sm', onclick: async () => { a.active = false; render(); await publish('Alert cleared'); } }, 'Clear alert')) : null,
      presets,
      h('div', { class: 'grid3' }, select(a, 'level', 'Level', [['RED', 'Red (crisis)'], ['AMBER', 'Amber (warning)'], ['INFO', 'Info (announcement)']]), h('div', { style: 'grid-column:span 2' }, text(a, 'title', 'Headline'))),
      text(a, 'message', 'Message', { multiline: true, rows: 2 }),
      h('button', { class: 'btn danger', onclick: async () => { a.active = true; a.id = uid('al'); render(); await publish('Alert broadcast to all screens'); } }, a.active ? 'Re-broadcast' : 'Broadcast now')),
    card('Announcements ticker', 'Scrolls across the top of the site. Newest first.',
      h('div', { style: 'display:flex;gap:8px;margin-bottom:14px' }, quick, h('button', { class: 'btn primary', onclick: post }, 'Post')),
      list(ann, (x) => h('div', { class: 'grid3', style: 'grid-template-columns:90px 1fr' }, text(x, 'time', null, { placeholder: 'time' }), text(x, 'text')), () => ({ id: uid('a'), time: '', text: '' }), { compact: true, addLabel: 'Add announcement', top: true })),
    card('Results visibility', null, check(D.results, 'published', 'Show the live leaderboard on the site', () => publish(D.results.published ? 'Leaderboard is visible' : 'Leaderboard hidden'))),
  ];
};

V.results = () => {
  const crit = D.judging || [];
  const total = (t) => crit.reduce((a, j) => a + (Number((t.scores || {})[j.name]) || 0) / 10 * Number(j.weight || 0), 0);
  const cells = {};
  const refresh = () => {
    const ranked = [...D.teams].sort((a, b) => total(b) - total(a));
    D.teams.forEach((t) => { if (cells[t.id]) { cells[t.id].tot.textContent = total(t).toFixed(1); cells[t.id].rk.textContent = '#' + (ranked.indexOf(t) + 1); } });
  };
  const rows = D.teams.map((t) => {
    t.scores = t.scores || {};
    const tot = h('td', { class: 'tot' }); const rk = h('td', { class: 'rank' }); cells[t.id] = { tot, rk };
    return h('tr', {}, h('td', {}, h('b', {}, t.name)),
      crit.map((j) => {
        const inp = h('input', { type: 'number', min: 0, max: 10, step: .5, value: t.scores[j.name] ?? '' });
        const set = (v) => { if (v === '' || v == null || isNaN(v)) delete t.scores[j.name]; else t.scores[j.name] = Math.max(0, Math.min(10, Math.round(v * 2) / 2)); inp.value = t.scores[j.name] ?? ''; refresh(); changed(); };
        inp.addEventListener('input', () => set(inp.value === '' ? '' : Number(inp.value)));
        return h('td', {}, h('span', { class: 'stepper' },
          h('button', { onclick: () => set((Number(t.scores[j.name]) || 0) - .5) }, '−'), inp,
          h('button', { onclick: () => set((Number(t.scores[j.name]) || 0) + .5) }, '+')));
      }), tot, rk);

V.media = () => {

  const status = h('div', { class: 'dim', style: 'margin-top:8px;font-size:.85rem' });
  const upload = async (files) => {
    files = [...files]; if (!files.length) return;
    prog.hidden = false; let done = 0;
    for (const f of files) {
      status.textContent = `Uploading ${f.name} (${done + 1}/${files.length})`;
      try {
        const out = await new Promise((res, rej) => {
          const x = new TT.UploadRequest(); x.open('POST', '/api/upload?name=' + encodeURIComponent(f.name));
          x.setRequestHeader('x-admin-passcode', PASS);
          x.upload.onprogress = (e) => { bar.style.width = ((done + e.loaded / e.total) / files.length * 100) + '%'; };
          x.onload = () => { const d = JSON.parse(x.responseText || '{}'); x.status < 300 ? res(d) : rej(new Error(d.error || 'Upload failed')); };
          x.onerror = () => rej(new Error('Network error')); x.send(f);
        });
        D.media.unshift({ id: uid('m'), type: f.type.startsWith('video') ? 'video' : 'image', url: out.url, caption: '' });
      } catch (e) { toast(`${f.name}: ${e.message}`, 'bad'); }
      done++;
    }
    render(); await publish(`${done} file${done > 1 ? 's' : ''} uploaded and live`);

  const drop = h('div', { class: 'drop', onclick: () => fileIn.click() }, h('b', {}, 'Drop photos or videos here'), 'or click to choose. They go live straight away.', fileIn);

    h('div', { style: 'display:flex;gap:8px;margin-top:12px;flex-wrap:wrap' },
      h('button', { class: 'btn', onclick: () => { try { const v = JSON.parse(ta.value); if (!v.event) throw new Error('Missing "event"'); D = v; changed(); toast('Applied. Publish to go live.'); } catch (e) { toast('Invalid JSON: ' + e.message, 'bad'); } } }, 'Apply'),
      h('button', { class: 'btn ghost', onclick: () => { const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' })), download: 'tech-tank-content.json' }); a.click(); } }, 'Download backup')))];
};

function render() {
  $('#tabs').replaceChildren(...TABS.map(([id, ic, l]) => h('button', { class: 'tab' + (tab === id ? ' on' : ''), onclick: () => { tab = id; try { localStorage.setItem('tt-tab', id); } catch {} $('#side').classList.remove('open'); render(); scrollTo(0, 0); } }, icon(ic), l)));
  $('#tabTitle').textContent = TABS.find((t) => t[0] === tab)[2];
  ['teams', 'tracks', 'schedule', 'rules', 'judging', 'media', 'faq', 'committee', 'announcements'].forEach((k) => { if (!Array.isArray(D[k])) D[k] = []; });
  D.results = D.results || { published: true }; D.crisis = D.crisis || { cards: [] }; D.crisis.cards = D.crisis.cards || [];
  D.portal = { welcome: '', demoMinutes: 3, qaMinutes: 2, presentationIntro: '', presentationNotes: '', submissionUrl: '', parameters: [], resultNotice: '', ...D.portal };
  $('#content').replaceChildren(...V[tab]());
}

/* ---------- auth + boot ---------- */
async function load() {
  D = await (await fetch('/api/content', { cache: 'no-store', headers: { 'x-admin-passcode': PASS } })).json();
  savedStr = JSON.stringify(D);
  $('#login').hidden = true; $('#app').hidden = false;
  render(); changed();
  const es = new EventSource('/api/stream');
  es.addEventListener('content', async () => {
    if (pendingPublish) return;
    // the stream carries the public (sealed) view, so fetch the full version with the passcode
    const full = await (await fetch('/api/content', { cache: 'no-store', headers: { 'x-admin-passcode': PASS } })).json();
    const incoming = JSON.stringify(full);
    if (incoming === savedStr) return;
    if (!isDirty()) { D = JSON.parse(incoming); savedStr = incoming; render(); }
    else toast('Someone else published changes. Yours will overwrite theirs when you publish.', 'bad');
  });
}
function logout() { try { localStorage.removeItem('tt-pass'); sessionStorage.removeItem('tt-pass'); } catch {} location.reload(); }

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); PASS = $('#pass').value;
  const r = await fetch('/api/login', { method: 'POST', headers: { 'x-admin-passcode': PASS } });
  if (!r.ok) { $('#loginErr').textContent = 'Wrong passcode'; return; }
  try { ($('#remember').checked ? localStorage : sessionStorage).setItem('tt-pass', PASS); } catch {}
  load();
});
$('#publish').onclick = () => publish();
$('#revert').onclick = () => { if (isDirty() && confirm('Discard unpublished changes?')) { D = JSON.parse(savedStr); render(); changed(); } };
$('#logout').onclick = logout;
$('#menu').onclick = () => $('#side').classList.toggle('open');
try { $('#autopub').checked = localStorage.getItem('tt-auto') === '1'; tab = localStorage.getItem('tt-tab') || 'live'; } catch {}
if (!TABS.some((t) => t[0] === tab)) tab = 'live';
$('#autopub').addEventListener('change', () => { try { localStorage.setItem('tt-auto', $('#autopub').checked ? '1' : '0'); } catch {} if ($('#autopub').checked) changed(); });
addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (D) publish(); } });
addEventListener('beforeunload', (e) => { if (D && isDirty()) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  let saved = null; try { saved = sessionStorage.getItem('tt-pass') || localStorage.getItem('tt-pass'); } catch {}
  if (saved) {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'x-admin-passcode': saved } });
    if (r.ok) { PASS = saved; return load(); }
  }
})();
})();

</script>
</body>
