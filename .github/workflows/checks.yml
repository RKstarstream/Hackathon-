name: Website checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # This application has no npm dependencies or build step.
      - name: Check server syntax
        run: |
          node --check server.js
          node --check participants.js
          node --check apps-script-sync.js
      - name: Test website and integrations
        run: npm test
